name: build-valve-20b
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download GGUF
        run: curl -fL --retry 3 -o gpt-oss-20b-MXFP4.gguf "https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-MXFP4.gguf"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/blakematthews-dev/valve-20b:latest
